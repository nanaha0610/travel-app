<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel App | みんなでつくる旅</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="header">
    <a class="logo" href="index.html">Travel App</a>
    <a href="#ideas">旅のアイデア</a>
  </header>
  <main>
    <!-- まずはタイトルや説明文を変えてみよう -->
    <section class="hero">
      <p class="eyebrow">みんなでつくる旅行サービス</p>
      <h1>次の旅を、<br>ここから。</h1>
      <p>行きたい場所を見つけて、旅のアイデアを広げよう。</p>
      <a class="button" href="#ideas">旅のアイデアを見る</a>
    </section>
    <!-- カードを増やしたり、写真を付けたりしてみよう -->
    <section id="ideas" class="ideas" aria-labelledby="ideas-title">
      <h2 id="ideas-title">旅のアイデア</h2>
      <p>まずはサンプルから。ここをみんなで育てていこう。</p>
      <div class="cards">
        <article class="card"><span aria-hidden="true">🌊</span><h3>海でのんびり</h3><p>波の音を聞きながら、ゆっくり過ごす旅。</p></article>
        <article class="card"><span aria-hidden="true">🌿</span><h3>自然にふれる</h3><p>緑の中を歩いて、気分をリフレッシュ。</p></article>
        <article class="card"><span aria-hidden="true">🏘️</span><h3>街をめぐる</h3><p>知らない街で、おいしいものや景色を探そう。</p></article>
      </div>
    </section>
  </main>
  <footer>Travel App · <span id="year">2026</span></footer>
</body>
</html>
